<!doctype html><html><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>Solar Application Login</title><style>body{font-family:system-ui;background:#edf5ff;display:grid;place-items:center;height:100vh}.box{background:white;padding:30px;border-radius:15px;width:min(400px,92%);box-shadow:0 5px 30px #0002}input,button{width:100%;padding:12px;margin:7px 0}button{background:#075bbb;color:#fff;border:0;border-radius:8px}</style></head><body><div class=box><h2>Solar Application</h2><input id=e type=email placeholder=Email><input id=p type=password placeholder=Password><button onclick=go()>Sign In</button><div id=m></div></div><script src=../shared/config.js></script><script src=../shared/api.js></script><script>async function go(){try{await login(e.value,p.value);location.href="dashboard.html"}catch(x){m.textContent=x.message}}</script></body></html>
