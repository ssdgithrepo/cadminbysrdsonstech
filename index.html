<!doctype html><html><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>SRD/KKS Admin</title><style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui;background:#f4f8fd;color:#123}.top{background:#075bbb;color:#fff;padding:18px 24px}.wrap{max-width:1250px;margin:auto;padding:24px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}.card{background:#fff;border-radius:14px;padding:20px;box-shadow:0 3px 16px #0001}button{border:0;border-radius:8px;background:#075bbb;color:#fff;padding:10px 14px;cursor:pointer}table{width:100%;border-collapse:collapse}th,td{padding:10px;border-bottom:1px solid #e3e8ef;text-align:left}.danger{background:#b42318}</style></head><body><div class=top><b>SRD/KKS Central Admin</b><button style=float:right onclick=logout()>Logout</button></div><div class=wrap><div class=grid><div class=card><h3>Tenants</h3><h2 id=tcount>—</h2></div><div class=card><h3>Packages</h3><h2 id=pcount>—</h2></div><div class=card><h3>Platform</h3><p>Google Sheets + Apps Script multi-tenant control plane.</p></div></div><div class=card><h2>Customer Applications</h2><button onclick=load()>Refresh</button><div id=out>Loading...</div></div></div>
<script src=../shared/config.js></script><script src=../shared/api.js></script><script>
async function load(){try{let t=await api("listTenants"),p=await api("listPackages");tcount.textContent=t.data.length;pcount.textContent=p.data.length;out.innerHTML="<table><tr><th>Customer</th><th>Domain</th><th>Status</th><th>Tenant ID</th></tr>"+t.data.map(x=>`<tr><td>${esc(x.Name)}</td><td>${esc(x.PrimaryDomain)}</td><td>${x.Active}</td><td>${x.ID}</td></tr>`).join("")+"</table>"}catch(e){out.textContent=e.message}}
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}load()
</script></body></html>
